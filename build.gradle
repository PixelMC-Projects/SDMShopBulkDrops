buildscript {
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.54' }
}
apply plugin: 'net.minecraftforge.gradle'

version = '1.0.1'
group = 'cn.pixelmc.sdmshopbulk'
base { archivesName = 'sdmshop-bulk-drops-forge-1.20.1' }
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    visual {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            args '--mixin.config', 'sdmshopbulk.mixins.json'
            jvmArgs '-Xmx2G'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { sdmshopbulk { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'sdmshopbulk'
            mods { sdmshopbulk { source sourceSets.gametest } }
        }
        visualServer {
            parent minecraft.runs.server
            workingDirectory project.file('run-visual-server')
            mods { sdmshopbulk { source sourceSets.visual } }
        }
        visualClient {
            parent minecraft.runs.client
            client true
            workingDirectory project.file('run-visual-client')
            args '--username', 'ShopBulkVisual', '--width', '1280', '--height', '720'
            mods { sdmshopbulk { source sourceSets.visual } }
        }
    }
}
repositories {
    flatDir { dirs 'references' }
    maven { name = 'AliyunPublic'; url = 'https://maven.aliyun.com/repository/public' }
    maven { name = 'BMCLAPIForge'; url = 'https://bmclapi2.bangbang93.com/maven' }
}
repositories.configureEach { repo ->
    if (repo instanceof MavenArtifactRepository) {
        if (repo.url.host in ['maven.minecraftforge.net', 'libraries.minecraft.net'])
            repo.url = 'https://bmclapi2.bangbang93.com/maven'
        if (repo.url.host in ['repo.maven.apache.org', 'repo1.maven.org'])
            repo.url = 'https://maven.aliyun.com/repository/public'
    }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.33'
    compileOnly fileTree(dir: 'references', include: '*.jar')
    compileOnly 'org.spongepowered:mixin:0.8.5'
    runtimeOnly fg.deobf('reference:sdmshoprework-forge-1.20.1:6.11-pre')
    runtimeOnly fg.deobf('reference:architectury-9.2.14:forge')
    runtimeOnly fg.deobf('reference:ftb-library-forge:2001.2.10')
    runtimeOnly fg.deobf('reference:sdm_economy-forge-1.20.1:1.7.2')
    runtimeOnly fg.deobf('reference:sdm_ui_lib-forge-1.20.1:1.8.3')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += ['-proc:none'] }
tasks.named('jar', Jar).configure {
    manifest { attributes(['MixinConfigs': 'sdmshopbulk.mixins.json', 'Implementation-Version': project.version]) }
    finalizedBy 'reobfJar'
}
tasks.withType(net.minecraftforge.gradle.common.tasks.DownloadAssets).configureEach { assetRepository = 'https://bmclapi2.bangbang93.com/assets/' }
apply from: 'gradle/visual-export.gradle'

// Preserve the project's license and original-author notice in every published JAR.
tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) { into 'META-INF/pixelmc' }
    from(rootProject.file('NOTICE')) { into 'META-INF/pixelmc' }
    from(rootProject.file('LICENSE-EXCEPTION.md')) { into 'META-INF/pixelmc' }
}
